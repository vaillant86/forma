id: it.vaillant86.Forma
runtime: org.godotengine.GodotBaseApp
runtime-version: stable
sdk: org.freedesktop.Sdk//23.08
command: Forma
finish-args:
  - --socket=x11
  - --socket=wayland
  - --device=dri
  - --socket=pulseaudio
  - --filesystem=xdg-run/pipewire-0

modules:
  - name: forma
    buildsystem: simple
    build-commands:
      # Export the Godot project pack
      - godot --headless --export-pack "Linux" Forma.pck
      
      # Install binary wrapper and pack
      - install -Dm755 /app/bin/godot /app/bin/Forma
      - install -Dm644 Forma.pck /app/bin/Forma.pck
      
      # Install desktop metadata and icons
      - install -Dm644 it.vaillant86.Forma.desktop /app/share/applications/it.vaillant86.Forma.desktop
      - install -Dm644 it.vaillant86.Forma.metainfo.xml /app/share/metainfo/it.vaillant86.Forma.metainfo.xml
      - install -Dm644 it.vaillant86.Forma.png /app/share/icons/hicolor/512x512/apps/it.vaillant86.Forma.png
    sources:
      - type: git
        url: https://github.com/vaillant86/forma.git
        tag: main
